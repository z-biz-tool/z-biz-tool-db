name: CI / Tests / Build

# T-056：在 tag/release 之前由 PR 阶段跑测试；tag 阶段做构建发布。
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: cargo test + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reset broken cargo config (token format workaround)
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm deps
        run: |
          # z-biz-tool-shared 已发布为 npm 包，直接装即可
          npm install

      - name: Frontend typecheck
        # 原来写的是 `npx tsc --noEmit || echo "tsc reported errors; see above"`：tsc 失败时 echo
        # 成功退出，这一步永远是绿的，类型错误全部被吞掉。本机实测当前 main 是 0 error，
        # 所以直接去掉 `|| echo`，让它按本来该有的方式失败。
        run: npx tsc --noEmit -p tsconfig.json

      # 本仓的 tests/*.test.ts 此前从来没进过 CI：上面跑的是 cargo test 和 tsc，
      # 前端这套断言一次都没执行过。改了逻辑红了，流水线不会知道。
      - name: Frontend unit tests
        run: npm test

      - name: Cargo check (lib + tests)
        working-directory: src-tauri
        run: cargo check --tests --locked

      - name: Cargo test (lib + SQLite integration)
        working-directory: src-tauri
        run: |
          # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
          # ⇒ 本仓「[LIVE] 跳过 minimax 真实 API 实测…」这类跳过标记在 CI 日志里
          # 看不见 ⇒ 「没跑」看着跟「跑过了」一样。打开捕获后可核对。
          cargo test --lib -- --nocapture
          cargo test --test test_sqlite -- --nocapture
          # MySQL/PG 集成测试需要 docker，标了 #[ignore]，只在手动跑
          # （--no-run 是 cargo 级参数，放在 `--` 后 libtest 会报 Unrecognized option）
          cargo test --lib --no-run

      # 2026-10-21 新增：rustfmt 门禁（本仓此前**一条静态门都没有**）。
      # 本地实测 `cargo fmt --all --check` 有 **405 处差异**散在 30 多个文件里，
      # CI 完全不跑 fmt ⇒ 谁把格式改乱了没人知道，评审只能靠肉眼。
      # 格式债已在同一次提交里整仓清零（纯排版重排，Rust + TS 测试全过）。
      #
      # **clippy 暂不收严**（如实记账）：本仓 `cargo clippy --all-targets -- -D warnings`
      # 实测约 **100 条**，其中约 40 条是「从未构造/从未接线」的 API
      # （Pool / SecretStore / V2Envelope / 连接池 / 密钥持有者等），
      # 另有多条 `await_holding_lock` 落在测试代码的共享目录锁上。
      # 这些不是改几行能清的，是「接线还是删掉」的工程判断 ⇒ 不在这一轮里草率收严，
      # 更不能挂一条永远红的门禁。债记在 lead 的 `06_验收与风险清单.md` R12。
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ''
            label: Linux
          - platform: windows-latest
            args: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "$USERPROFILE/.cargo/config.toml"

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
