name: CI / Tests / Build

# T-056：在 tag/release 之前由 PR 阶段跑测试；tag 阶段做构建发布。
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: cargo test + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # cap-hub 走 ../../z-biz-tool-capability path 依赖：runner 上只有本仓，
      # 先把公共能力仓取到 workspace 内，再链接成 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Reset broken cargo config (token format workaround)
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm deps
        run: |
          # z-biz-tool-shared 已发布为 npm 包，直接装即可
          npm install

      - name: Frontend typecheck
        # 原来写的是 `npx tsc --noEmit || echo "tsc reported errors; see above"`：tsc 失败时 echo
        # 成功退出，这一步永远是绿的，类型错误全部被吞掉。本机实测当前 main 是 0 error，
        # 所以直接去掉 `|| echo`，让它按本来该有的方式失败。
        run: npx tsc --noEmit -p tsconfig.json

      # 本仓的 tests/*.test.ts 此前从来没进过 CI：上面跑的是 cargo test 和 tsc，
      # 前端这套断言一次都没执行过。改了逻辑红了，流水线不会知道。
      - name: Frontend unit tests
        run: npm test

      - name: Cargo check (lib + tests)
        working-directory: src-tauri
        run: cargo check --tests --locked

      - name: Cargo test (lib + SQLite integration)
        working-directory: src-tauri
        run: |
          # `-- --nocapture`：Rust 测试框架默认**吞掉通过用例的 stdout/stderr**
          # ⇒ 本仓「[LIVE] 跳过 minimax 真实 API 实测…」这类跳过标记在 CI 日志里
          # 看不见 ⇒ 「没跑」看着跟「跑过了」一样。打开捕获后可核对。
          cargo test --lib -- --nocapture
          cargo test --test test_sqlite -- --nocapture
          # MySQL/PG 集成测试需要 docker，标了 #[ignore]，只在手动跑
          # （--no-run 是 cargo 级参数，放在 `--` 后 libtest 会报 Unrecognized option）
          cargo test --lib --no-run

      # 2026-10-21 新增：rustfmt 门禁（本仓此前**一条静态门都没有**）。
      # 本地实测 `cargo fmt --all --check` 有 **405 处差异**散在 30 多个文件里，
      # CI 完全不跑 fmt ⇒ 谁把格式改乱了没人知道，评审只能靠肉眼。
      # 格式债已在同一次提交里整仓清零（纯排版重排，Rust + TS 测试全过）。
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check

      # 2026-10-22 新增：clippy 收严为 `-D warnings` 并变成门禁。
      #
      # 此前**不收严**是有据的：当时 `cargo clippy --all-targets -- -D warnings`
      # 实测约 100 条告警，其中约 40 条是「从未构造/从未接线」的 API
      # （Pool / SecretStore / V2Envelope / 连接池 / 密钥持有者等）——
      # 那不是改几行能清的，是「接线还是删掉」的工程判断。
      #
      # 现在这些 API 已**逐个接线或删除**（连接池按参数指纹复用、密钥库接进
      # save/load_connections、v2 包络接进三个 v2 命令、流式批次接进
      # query_start/query_next、多语句门禁补上……），本仓 clippy 告警实测归零，
      # 所以门禁可以挂上。**收严之后 CI 红了就修真 lint，不许回退门禁。**
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # ─────────────────────────────────────────────────────────────────────
  # prepare-release：**独占**创建本次 tag 的 Release。
  #
  # 为什么必须单独一个 job：tauri-action 的「查不到就建 release」不是原子的。
  # 四条矩阵腿并发跑时会有两条腿同时「查不到」⇒ 各建一个 Release
  # （2026-10-31 history v0.1.0 首次发布实测：建出 id 430011860 与 430011862
  # 两个同 tag 的 Release，资产分散在两边，其中一个还停在 draft）。
  # 后果是 `releases/tags/$TAG` 只解析到其中一个 ⇒ 另一条腿在自己的 Release 里
  # 找不到资产却查的是「那个」Release ⇒ 匹配到 0 个 ⇒ 整条腿失败、
  # latest.json 推不出去（发布静默半残，用户点更新必失败）。
  #
  # 成熟仓没踩到，是因为它们的 Release 在**前一次**发版时已经存在，
  # 四腿直接复用 ⇒ 只有「从零开始的第一次发版」和「删 release 重发」才会撞上。
  #
  # 做法：用一个单线程 job 先把 Release 建好（幂等：已存在就复用），
  # 把 release id 传给四条腿，四腿用 releaseId 上传资产 —— 天然只有一个 Release。
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.rel.outputs.id }}
    steps:
      - name: Create or reuse the release for this tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          # 找出这个 tag 已有的**正式** release（非 draft）。
          # 注意：不能用 `releases/tags/$TAG` —— 它对 draft 的处理特殊，
          # 而且 tag 已被占用时会指向别的 release。
          EXISTING=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            # ⚠️ 变量名后面紧跟中文标点时，bash 在 UTF-8 locale 下会把标点并进变量名
            # （${EXISTING}（ 会被当成一个不存在的变量），报出看不懂的 unbound variable。
            # 一律用 ${} 把名字边界写死。
            echo "复用已有 release id=${EXISTING}（tag ${TAG}）"
            echo "id=${EXISTING}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 清理这个 tag 下的**残留 draft**（并发竞态的产物）：
          # 它们占着 tag、又对用户不可见，留着会让后续查询一直指错。
          STALE=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" || true)
          for id in $STALE; do
            echo "清理残留 draft release id=${id}"
            gh api -X DELETE "repos/$REPO/releases/$id" || true
          done

          # ⚠️ 布尔值必须用 -F（会做类型转换），用 -f 会当成字符串
          # ⇒ GitHub 返回 422 "For 'properties/draft', \"false\" is not a boolean"。
          # ⚠️ 续行反斜杠后面**不能跟注释行** —— YAML 会把注释当脚本内容传给 bash，
          # bash 里 \ + 注释行 ⇒ 续行被截断，后面的参数变成独立命令
          # ⇒ "command not found"（exit 127）。注释一律写在整条命令之前。
          NEW_ID=$(gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="See the assets below to download this version." \
            -F draft=false -F prerelease=false \
            --jq .id)
          echo "新建 release id=${NEW_ID}（tag ${TAG}）"
          echo "id=${NEW_ID}" >> "$GITHUB_OUTPUT"

  build:
    # prepare-release 建好 Release（拿 id）；test 过了才值得出包 —— 两个前置都要
    needs: [test, prepare-release]
    # latest-json 作业据此决定要不要推 manifest（缺签名密钥时整条更新通道静默降级）
    outputs:
      signing-mode: ${{ steps.signing.outputs.mode }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ''
            label: Linux
          - platform: windows-latest
            args: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # cap-hub 走 ../../z-biz-tool-capability path 依赖：runner 上只有本仓，
      # 先把公共能力仓取到 workspace 内，再链接成 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Reset broken cargo config
        shell: bash
        run: rm -f "$HOME/.cargo/config.toml" "$USERPROFILE/.cargo/config.toml"

      - name: Install system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm dependencies
        run: npm install

      # 自动更新签名（2026-10-25 接入，详见 z-biz-tool-lead/doc/分发/updater-官方化指南.md）：
      # tauri.conf.json 里 createUpdaterArtifacts=true + 非空 pubkey 时，tauri build 在没有
      # TAURI_SIGNING_PRIVATE_KEY 的情况下会**直接报错**（"A public key has been found, but
      # no private key"）。这里做 fail-soft：缺 secret 就加 --no-sign 跳过签名并打 warning，
      # 保证密钥未就绪时发布构建不挂；密钥配好后自动恢复签名 + 产出 .sig。
      - name: Check updater signing secret (fail-soft)
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "extra-args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY：本次发布跳过更新包签名（--no-sign）。配置方法见 z-biz-tool-lead/doc/分发/updater-官方化指南.md"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "extra-args=--no-sign" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.mode == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.signing.outputs.mode == 'signed' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # 用 prepare-release 建好的 release id 上传，**不要**让 tauri-action 自己
          # 建 release（它的查-建不是原子的，四腿并发会建出多个，见 prepare-release 注释）。
          # 给了 releaseId 之后 tagName/releaseName/releaseDraft 都不再被考虑。
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          args: ${{ matrix.args }} ${{ steps.signing.outputs.extra-args }}
          # ⚠️ 参数名必须写 includeUpdaterJson —— 写成 uploadUpdaterJson 会被 tauri-action
          # 当未知输入**静默忽略**（只报一条 warning），于是每条矩阵腿都各自生成并上传
          # latest.json，四腿并发抢同一个资产名，后到者把先到的顶掉、或直接把那条腿
          # 判成失败（2026-10-30 note v1.2.0 实测：macOS x64 腿就倒在 "Uploading latest.json"）。
          # latest.json 一律由 latest-json 作业统一生成。
          includeUpdaterJson: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app

      # 本平台的 latest.json 条目（url 指向 release 资产，signature 是 .sig 文件内容）。
      # v2 模式（createUpdaterArtifacts: true）的更新包：macOS=*.app.tar.gz、
      # Windows=*.msi、Linux=*.AppImage，各自旁边应有同名 .sig。
      # ⚠️ 目录名不带点：actions/upload-artifact@v4 **默认不上传隐藏文件/目录**，
      # 早期写成 .updater-fragments 时四平台都报 "No files were found"，
      # 于是 latest.json 永远推不出去、更新通道静默失效（music v0.1.0 首次发布实测踩到）。
      - name: Generate updater manifest fragment
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-fragments
          case "${{ matrix.label }}" in
            macOS-ARM)
              PLATFORM="darwin-aarch64"
              BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
              PATTERN="*.app.tar.gz"
              ;;
            macOS-Intel)
              PLATFORM="darwin-x86_64"
              BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
              PATTERN="*.app.tar.gz"
              ;;
            Linux)
              PLATFORM="linux-x86_64"
              BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
              PATTERN="*.AppImage"
              ;;
            Windows)
              PLATFORM="windows-x86_64"
              BUNDLE_DIR="src-tauri/target/release/bundle/msi"
              PATTERN="*.msi"
              ;;
            *)
              echo "::error::未知 matrix.label: ${{ matrix.label }}"
              exit 1
              ;;
          esac
          ASSET=$(ls "$BUNDLE_DIR"/$PATTERN | head -1)
          SIG="$ASSET.sig"
          if [ ! -f "$SIG" ]; then
            echo "::error::缺少签名文件 $SIG —— 签名应在 Build 步骤随 TAURI_SIGNING_PRIVATE_KEY 一起生成"
            exit 1
          fi
          # ⚠️ 远端资产名 ≠ 本地文件名。同一个 Release 里两个 macOS 矩阵都产出
          # `z-biz-tool-db.app.tar.gz`，tauri-action 上传时会自动加架构后缀消歧
          #   → z-biz-tool-db_aarch64.app.tar.gz / ..._x64.app.tar.gz
          # 所以 url 不能拿本地文件名拼，否则 latest.json 里的链接直接 404
          # （music v0.1.0 第一次发布就是这个形状：文件都在、链接全错、点更新必失败）。
          # 做法：回查本 tag 的 release 资产，按「同扩展名 + 同架构词」唯一匹配，
          # 再用远端 .sig 与本地 .sig 逐字节比对，确认挑的确实是同一个包。
          LOCAL_NAME=$(basename "$ASSET")
          EXT=".${LOCAL_NAME#*.}"
          case "$PLATFORM" in
            darwin-aarch64) ARCH_TOKEN="aarch64" ;;
            darwin-x86_64)  ARCH_TOKEN="x64" ;;
            linux-x86_64)   ARCH_TOKEN="amd64" ;;
            windows-x86_64) ARCH_TOKEN="x64" ;;
          esac
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          # ⚠️ 不能用 `gh api repos/$REPO/releases/tags/$TAG` 查资产：
          # tauri-action 的旧竞态可能留下多个同 tag Release，`releases/tags/` 只解析
          # 到其中一个 ⇒ 自己的资产可能在另一个里 ⇒ 匹配到 0 个而失败。
          # 列出该 tag 的**所有** Release，把它们的资产并成一张表再匹配。
          # （history v0.1.0 首发实测踩到；prepare-release 已根治，此处是兜底。）
          gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | [.id, .name] | @tsv" > /tmp/assets.tsv
          if [ ! -s /tmp/assets.tsv ]; then
            echo "::error::tag $TAG 下没有任何 Release 资产 —— Release 没建出来？"
            exit 1
          fi
          MATCHES=$(awk -F'\t' -v ext="$EXT" -v arch="$ARCH_TOKEN" \
            'index($2, ext) == length($2) - length(ext) + 1 && index($2, arch) > 0 { print }' /tmp/assets.tsv)
          COUNT=$(printf '%s\n' "$MATCHES" | awk 'NF' | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "::error::在 tag ${TAG} 的所有 Release 里按「${EXT} + ${ARCH_TOKEN}」匹配到 ${COUNT} 个资产（应为 1）："
            printf '%s\n' "$MATCHES"
            cut -f2 /tmp/assets.tsv
            exit 1
          fi
          NAME=$(printf '%s\n' "$MATCHES" | cut -f2)
          SIG_ID=$(awk -F'\t' -v n="$NAME.sig" '$2 == n { print $1 }' /tmp/assets.tsv)
          if [ -z "$SIG_ID" ]; then
            echo "::error::release 里找不到 ${NAME}.sig"
            exit 1
          fi
          gh api "repos/$REPO/releases/assets/$SIG_ID" -H "Accept: application/octet-stream" > /tmp/remote.sig
          if ! diff -q /tmp/remote.sig "$SIG" > /dev/null; then
            echo "::error::远端 ${NAME}.sig 与本地签名不一致 —— 挑错资产了，或者签的不是同一个包"
            exit 1
          fi
          URL="https://github.com/$REPO/releases/download/$TAG/$NAME"
          node -e '
            const fs = require("fs");
            const [platform, url, sigPath] = process.argv.slice(1);
            const fragment = { [platform]: { url, signature: fs.readFileSync(sigPath, "utf8").trim() } };
            fs.writeFileSync(`updater-fragments/${platform}.json`, JSON.stringify(fragment, null, 2) + "\n");
          ' "$PLATFORM" "$URL" "$SIG"

      - name: Upload updater manifest fragment
        if: steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: updater-frag-${{ matrix.label }}
          path: updater-fragments/*.json
          if-no-files-found: error

  # 把 4 个平台的片段合并成一个 latest.json 推到 main（固定分支）。
  # endpoint 见 tauri.conf.json：https://raw.githubusercontent.com/z-biz-tool/z-biz-tool-db/main/latest.json
  # 回滚 = 把 main 上的 latest.json 改回上一版（详见指南「版本号纪律与回滚」）。
  latest-json:
    name: Publish latest.json
    needs: [build, prepare-release]
    if: needs.build.outputs.signing-mode == 'signed'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download platform fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-frag-*
          path: updater-fragments
          merge-multiple: true

      - name: Compose latest.json and push to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # pubkey 还是占位符 ⇒ 客户端验不过签名，推了也是坏更新，直接跳过并警告
          PUBKEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if [ "$PUBKEY" = "<TAURI_UPDATER_PUBKEY>" ]; then
            echo "::warning::pubkey 仍是占位符 <TAURI_UPDATER_PUBKEY>，跳过 latest.json 推送。请先按指南填入 CEO 生成的公钥。"
            exit 0
          fi

          # 用 release **id** 取 notes，不按 tag 取 —— 按 tag 取在「同 tag 多个 Release」时会拿到不确定的那一个。
          RELEASE_ID="${{ needs.prepare-release.outputs.release-id }}"
          NOTES=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --jq .body 2>/dev/null || echo "Release $TAG")
          NOTES="${NOTES:-Release $TAG}"
          node -e '
            const fs = require("fs");
            const [version, notes] = process.argv.slice(1);
            const dir = "updater-fragments";
            const platforms = {};
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith(".json"))) {
              Object.assign(platforms, JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")));
            }
            if (Object.keys(platforms).length === 0) {
              console.error("没有收集到任何平台片段，拒绝推空 latest.json");
              process.exit(1);
            }
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms,
            }, null, 2) + "\n");
            console.log("latest.json 平台:", Object.keys(platforms).join(", "));
          ' "$VERSION" "$NOTES"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(release): 更新 latest.json 到 v$VERSION [skip ci]"
          git push origin HEAD:main
