<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B7A75"/>
      <stop offset="1" stop-color="#0F9B8E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FF9E8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FF9E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="232" fill="url(#bg)"/>

  <!-- 三层盘片：从下往上叠，最后补两条分界线 -->
  <g fill="#FFFFFF">
    <rect x="298" y="556" width="428" height="112"/>
    <ellipse cx="512" cy="668" rx="214" ry="62"/>
    <rect x="298" y="446" width="428" height="112"/>
    <ellipse cx="512" cy="558" rx="214" ry="62"/>
    <rect x="298" y="336" width="428" height="112"/>
    <ellipse cx="512" cy="336" rx="214" ry="62"/>
  </g>
  <g fill="none" stroke="#122A33" stroke-opacity="0.16" stroke-width="10">
    <path d="M298 446 a214 62 0 0 0 428 0"/>
    <path d="M298 556 a214 62 0 0 0 428 0"/>
  </g>

  <!-- 顶面高光 + 查询命中的那一点 -->
  <ellipse cx="512" cy="336" rx="214" ry="62" fill="#7FF9E8" fill-opacity="0.28"/>
  <circle cx="640" cy="600" r="120" fill="url(#glow)"/>
  <circle cx="640" cy="600" r="30" fill="#34E8D2"/>
  <rect x="620" y="470" width="40" height="24" rx="12" fill="#FF6B6B"/>
</svg>
