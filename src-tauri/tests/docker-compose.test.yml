# T-027：三驱动集成测试 docker-compose（CI 用）
#
# 本地启动：
#   docker compose -f tests/docker-compose.test.yml up -d
#   export Z_BIZ_TOOL_DB_MYSQL_URL=mysql://root:test_password_do_not_use@127.0.0.1:3306/testdb
#   export Z_BIZ_TOOL_DB_PG_URL=postgres://postgres:test_password_do_not_use@127.0.0.1:5432/testdb
#   cargo test -- --ignored --test-threads=1
#
# 测试后清理：
#   docker compose -f tests/docker-compose.test.yml down -v
version: "3.8"
services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test_password_do_not_use
      MYSQL_DATABASE: testdb
    ports:
      - "0:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptest_password_do_not_use"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test_password_do_not_use
      POSTGRES_DB: testdb
    ports:
      - "0:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
