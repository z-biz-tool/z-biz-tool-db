[package]
name = "z-biz-tool-db"
version = "0.2.0"
description = "数据库管理工具 - 对标Beekeeper Studio/DBeaver"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_db_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
# 家族统一 AI 接入层（2026-11-01）：本仓 report/ai.rs 里手写的 OpenAI 兼容
# HTTP、is_private_endpoint 副本，都是 file/terminal/note/kb 里同一件事的
# 第 N 次重写。协议、鉴权头、错误脱敏全收口到 cap-llm。
cap-llm = { path = "../../z-biz-tool-capability/crates/cap-llm" }
# 家族统一 LLM 配置落点：~/.z-biz-tool/llm/config.json + OS 密钥库。
# 本仓原明文 ai_config.json（api_key 明文落盘）由启动迁移器搬入并抹掉密钥。
cap-llm-config = { path = "../../z-biz-tool-capability/crates/cap-llm-config" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "mysql",
  "postgres",
  "sqlite",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
] }
getrandom = "0.2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
dirs = "5"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
# T-031：按 try_next 消费 sqlx 的 fetch() 流，取够就停（该 crate 本就在 sqlx 依赖树里）
futures-util = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
keyring = "4.2.0"

[dev-dependencies]
# tauri 的 test feature 用来跑真实 IPC 通道（tests/tauriArgNaming.rs）：
# 把「Tauri v2 怎么收参」变成可复跑的断言，而不是注释里的口头约定。
tauri = { version = "2", features = ["test"] }
